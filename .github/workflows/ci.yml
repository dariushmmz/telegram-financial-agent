name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements-test.lock

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run deterministic test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q

      - name: Scan deployable source for secrets
        run: python scripts/security_scan.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag telegram-receipt-bot:ci .
